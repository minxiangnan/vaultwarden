# Optional Postgres override. The published GHCR image is SQLite only.
# Rebuild with the postgres feature, then start both files:
#
#   VW_FEATURES=sqlite,postgresql docker compose \
#     -f docker-compose.prod.yml -f docker-compose.postgres.yml up -d --build
#
# Set POSTGRES_PASSWORD in .env. Back up with pg_dump, not scripts/vw-backup.sh.

services:
  vaultwarden:
    environment:
      DATABASE_URL: postgresql://vaultwarden:${POSTGRES_PASSWORD}@postgres:5432/vaultwarden
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultwarden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: vaultwarden
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultwarden -d vaultwarden"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal

volumes:
  pg-data:
