# 自建带验证器同步和 MCP 的 Vaultwarden。
# 先看 docs/zh-authenticator-deploy.md 里的最短启动命令。
#
#   export ADMIN_TOKEN="$(openssl rand -base64 32)"
#   export DOMAIN="https://vault.example.com"
#   docker compose up -d --build

services:
  vaultwarden:
    image: ghcr.io/minxiangnan/vaultwarden:zh-authenticator
    build:
      context: .
      dockerfile: docker/Dockerfile.zh
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-https://vault.example.com}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      SIGNUPS_VERIFY: ${SIGNUPS_VERIFY:-false}
      ENABLE_WEBSOCKET: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请设置 ADMIN_TOKEN}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      WEB_VAULT_ENABLED: ${WEB_VAULT_ENABLED:-false}
      ROCKET_PROFILE: release
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: 8080
    volumes:
      - ./vw-data:/data
    ports:
      - "${HOST_PORT:-8080}:8080"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - vaultwarden

volumes:
  caddy-data:
  caddy-config:
